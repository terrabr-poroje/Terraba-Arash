name: Build and deploy Terrabar to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - "wrangler.json"
      - ".github/workflows/deploy-terrabar-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraba-arash-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production app
        run: bun run build:worker
      - name: Lint application before production deployment
        run: bun run lint

      - name: Run automated tests before production deployment
        run: bun run test

      - name: Verify generated Cloudflare Worker config
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          if (!fs.existsSync(path)) {
            throw new Error('Refusing deployment: generated Cloudflare Worker config is missing.');
          }
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.main) {
            throw new Error('Refusing deployment: generated Worker entry point is missing.');
          }
          const expectedWorker = 'terraba-arash';
          if (Object.prototype.hasOwnProperty.call(config, 'routes')) {
            throw new Error('Refusing deployment: routes must remain managed by the existing Cloudflare custom-domain configuration.');
          }
          if (config.assets?.binding !== 'ASSETS') {
            throw new Error('Refusing deployment: expected ASSETS binding is missing.');
          }
          const d1 = (config.d1_databases || []).find(binding =>
            binding.binding === 'DB' && binding.database_id === '9da7735b-e4c9-4f7f-9abe-53ba1545c60e'
          );
          if (!d1) {
            throw new Error('Refusing deployment: existing Terrabar D1 binding does not match.');
          }
          config.name = expectedWorker;
          config.keep_vars = true;
          config.secrets = {
            ...(config.secrets || {}),
            required: [...new Set([...(config.secrets?.required || []), 'SMS_IR_API_KEY'])]
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          const verified = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (verified.name !== expectedWorker || verified.keep_vars !== true) {
            throw new Error('Refusing deployment: Worker target or keep-vars safeguard is incorrect.');
          }
          if (Object.prototype.hasOwnProperty.call(verified, 'routes')) {
            throw new Error('Refusing deployment: generated config must not manage domain routes.');
          }
          if (!verified.secrets?.required?.includes('SMS_IR_API_KEY')) {
            throw new Error('Refusing deployment: required SMS secret guard is missing.');
          }
          console.log('Verified target terraba-arash; retained ASSETS and D1 bindings; preserved dashboard vars; required existing SMS_IR_API_KEY; no routes will be changed.');
          NODE

      - name: Deploy existing Terrabar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "980efee43cd0c6512bb7ffce38e319c6"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing Cloudflare API token secret. Production was not changed."
            exit 1
          fi
          bunx wrangler deploy --config .output/server/wrangler.json

      - name: Smoke-test production routes
        run: |
          set -euo pipefail
          for base in https://terrabar.ir https://www.terrabar.ir; do
            for route in / /auth /member-home /account /account-preview /seller-account-preview /supplier-account-preview /login-buyer /login-seller /login-supplier /seller-accounting-preview /seller-orders-preview /seller-purchase-preview /orders-current-preview /orders-completed-preview /membership /announce /requests /cart /professional-purchase /admin-login /reset-password; do
              status="000"
              for attempt in 1 2 3 4 5 6; do
                status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$base$route" || true)"
                if [ "$status" = "200" ]; then break; fi
                echo "$base$route -> HTTP $status (attempt $attempt/6)"
                sleep 4
              done
              echo "$base$route -> HTTP $status"
              test "$status" = "200"
            done
          done
